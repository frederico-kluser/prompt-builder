# =============================================================================
# OpenSSF Scorecard — prompt-builder (frederico-kluser/prompt-builder)
#
# Análise contínua da cadeia de fornecimento; resultados publicados em
# https://securityscorecards.dev (publish_results: true) e carregados como
# artefato SARIF para revisão. Depois da primeira corrida publicada, adicione o
# badge ao README (https://api.securityscorecards.dev/projects/github.com/
# frederico-kluser/prompt-builder/badge.svg).
#
# As actions estão fixadas por SHA (pinned dependencies) — atualize com o
# oss-pin-actions.sh da skill opensource-project.
# =============================================================================

name: OpenSSF Scorecard

on:
  branch_protection_rule: # re-avaliar quando os rulesets mudarem
  schedule:
    - cron: "30 5 * * 1" # semanalmente, segunda-feira às 05:30 UTC
  push:
    branches:
      - main

# Privilégio mínimo global; cada job declara a elevação pontual de que precisa.
permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # gravar SARIF em code scanning
      id-token: write # OIDC para publicar resultados assinados
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
