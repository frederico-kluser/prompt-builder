<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>macOS — Finder</title><style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:13px/1.35 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;color:#1d1d1f;overflow:hidden}
  body{background:#173752 radial-gradient(1200px 720px at 22% 12%,rgba(122,180,240,.20),transparent 72%)}
  button{border:0;background:none;font:inherit;color:inherit;cursor:pointer}
  .menubar{height:28px;display:flex;align-items:center;gap:2px;padding:0 10px;background:rgba(28,26,24,.55);backdrop-filter:blur(18px);color:#f5f5f7;font-size:13px}
  .menubar .item{padding:3px 9px;border-radius:5px}
  .menubar .item:hover{background:rgba(255,255,255,.16)}
  .menubar .apple{font-size:15px;padding:2px 9px}
  .menubar .right{margin-left:auto;display:flex;align-items:center;gap:12px;padding-right:4px}
  .status{display:flex;align-items:center;gap:5px;font-size:12px}
  .status svg{display:block}
  .desktop{position:relative;height:calc(100% - 28px)}
  .win{position:absolute;left:210px;top:54px;width:1240px;height:760px;border-radius:11px;overflow:hidden;background:#fff;box-shadow:0 30px 70px rgba(0,0,0,.45),0 0 0 .5px rgba(0,0,0,.25);display:flex;flex-direction:column}
  .titlebar{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#f6f6f8;border-bottom:1px solid #e3e3e6}
  .lights{display:flex;gap:8px;margin-right:8px}
  .tl{width:12px;height:12px;border-radius:50%;display:block}
  .tl-r{background:#ff5f57}.tl-y{background:#febc2e}.tl-g{background:#28c840}
  .title{font-weight:600;font-size:13.5px;margin-right:auto}
  .toolbar{display:flex;align-items:center;gap:8px}
  .tb{width:28px;height:24px;border-radius:6px;display:grid;place-items:center;color:#48484a}
  .tb:hover{background:#e9e9ec}
  .search{display:flex;align-items:center;gap:6px;height:26px;width:210px;padding:0 9px;background:#e9e9ec;border-radius:7px;color:#6e6e73;font-size:12px}
  .search input{border:0;outline:0;background:transparent;font:inherit;color:#1d1d1f;width:100%}
  .seg{display:flex;background:#e9e9ec;border-radius:7px;padding:2px}
  .seg button{padding:3px 10px;border-radius:5px;font-size:12px;color:#3a3a3c}
  .seg button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.18)}
  .body{display:flex;flex:1;min-height:0}
  .side{width:212px;background:#f2f2f5;border-right:1px solid #e3e3e6;padding:10px 8px;display:flex;flex-direction:column;gap:2px}
  .side .head{font-size:11px;font-weight:600;color:#8e8e93;padding:6px 8px 4px;text-transform:none}
  .side a{display:block;padding:5px 9px;border-radius:6px;color:#3a3a3c;text-decoration:none;font-size:13px}
  .side a.on{background:#dcdce1;font-weight:600}
  .content{flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:0}
  .colhead{display:grid;grid-template-columns:1fr 130px 90px;gap:10px;padding:4px 8px 8px;border-bottom:1px solid #e8e8ea;color:#8e8e93;font-size:11.5px}
  .file{display:grid;grid-template-columns:1fr 130px 90px;gap:10px;align-items:center;padding:8px;border-radius:6px;text-align:left;width:100%;font-size:13px;color:inherit;text-decoration:none}
  .file:hover{background:#f2f5ff}
  .file .nm{display:flex;align-items:center;gap:9px;min-width:0}
  .file .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .icon{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;flex:none}
  .icon.doc{background:#dbe9ff}.icon.folder{background:#cfe2ff}
  .dock{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:8px;padding:7px 10px;border-radius:18px;background:rgba(255,255,255,.28);backdrop-filter:blur(22px);box-shadow:0 12px 30px rgba(0,0,0,.28)}
  .app{width:46px;height:46px;border-radius:11px;display:grid;place-items:center;font-size:22px;color:#fff}
  .app.finder{background:linear-gradient(180deg,#4ea3f7,#1f74d8)}
  .app.safari{background:linear-gradient(180deg,#67c6f7,#1a7fd4)}
  .app.mail{background:linear-gradient(180deg,#63b3ff,#1f6fe0)}
  .app.messages{background:linear-gradient(180deg,#5ee06a,#1fa838)}
  .app.trash{background:linear-gradient(180deg,#c9ced8,#9aa1ad);font-size:24px}
  .folder-desktop{position:absolute;display:flex;flex-direction:column;align-items:center;gap:5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55);font-size:12px;padding:8px;border-radius:8px}
  .folder-desktop .big{width:58px;height:46px;border-radius:7px;background:linear-gradient(180deg,#8ec5ff,#4b90e8);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
</style></head>
<body>
<div class="menubar">
  <button class="item apple" data-vision-id="mac-apple" data-vision-icon="menu Apple" data-vision-aliases="logo da apple"><svg width="14" height="16" viewBox="0 0 16 18" fill="currentColor" aria-hidden="true"><path d="M11.6 9.6c0-1.6 1.3-2.4 1.4-2.4-.8-1.1-2-1.2-2.4-1.2-1-.1-2 .6-2.5.6-.5 0-1.3-.6-2.2-.6-1.1 0-2.2.7-2.8 1.7-1.2 2.1-.3 5.2.9 6.9.6.8 1.3 1.7 2.2 1.7.9 0 1.2-.6 2.3-.6s1.4.6 2.3.6c1 0 1.6-.9 2.2-1.7.7-1 1-1.9 1-2-.1 0-1.9-.7-2.4-3Z"/><path d="M10 4.5c.4-.5.7-1.2.6-1.9-.6 0-1.3.4-1.7.9-.4.4-.7 1.1-.6 1.8.7.1 1.4-.3 1.7-.8Z"/></svg></button>
  <button class="item" data-vision-id="mac-menu-finder" data-vision-type="menuitem">Finder</button>
  <button class="item" data-vision-id="mac-menu-arquivo" data-vision-type="menuitem">Arquivo</button>
  <button class="item" data-vision-id="mac-menu-editar" data-vision-type="menuitem">Editar</button>
  <button class="item" data-vision-id="mac-menu-visualizar" data-vision-type="menuitem">Visualizar</button>
  <button class="item" data-vision-id="mac-menu-ir" data-vision-type="menuitem">Ir</button>
  <button class="item" data-vision-id="mac-menu-janela" data-vision-type="menuitem">Janela</button>
  <button class="item" data-vision-id="mac-menu-ajuda" data-vision-type="menuitem">Ajuda</button>
  <div class="right">
    <button class="status" data-vision-id="mac-wifi" data-vision-icon="Wi-Fi" data-vision-aliases="rede sem fio"><svg width="15" height="12" viewBox="0 0 15 12" fill="none"><path d="M1 4.2C4.8.7 10.2.7 14 4.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M3.3 6.7c2.4-2.2 5.9-2.2 8.4 0" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M6.1 9.2c.8-.8 2-.8 2.8 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="7.5" cy="11" r=".9" fill="currentColor"/></svg></button>
    <button class="status" data-vision-id="mac-bateria" data-vision-label="Bateria 100%" data-vision-aliases="bateria|carga da bateria"><svg width="22" height="11" viewBox="0 0 22 11" fill="none"><rect x=".6" y=".6" width="18" height="9.8" rx="2.4" stroke="currentColor" stroke-opacity=".7" stroke-width="1.1"/><rect x="2.2" y="2.2" width="12.5" height="6.6" rx="1.4" fill="currentColor"/><path d="M20.2 4v3" stroke="currentColor" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round"/></svg><span>100%</span></button>
    <button class="status" data-vision-id="mac-busca-menu" data-vision-icon="lupa de busca do sistema" data-vision-aliases="pesquisa do sistema"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="5.6" cy="5.6" r="4.1" stroke="currentColor" stroke-width="1.3"/><path d="M8.9 8.9 11.4 11.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
    <span class="status">qua, 21 out 18:42</span>
  </div>
</div>
<div class="desktop">
  <button class="folder-desktop" style="left:36px;top:40px" data-vision-id="mac-pasta-projetos" data-vision-aliases="pasta projetos">
    <span class="big"></span>Projetos
  </button>
  <button class="folder-desktop" style="left:36px;top:150px" data-vision-id="mac-lixeira" data-vision-aliases="trash|lixo">
    <span class="big" style="background:linear-gradient(180deg,#d7dbe3,#a8b0bd)"></span>Lixeira
  </button>

  <div class="win">
    <div class="titlebar">
      <div class="lights">
        <button class="tl tl-r" data-vision-id="win-fechar" data-vision-icon="fechar janela"></button>
        <button class="tl tl-y" data-vision-id="win-minimizar" data-vision-icon="minimizar janela"></button>
        <button class="tl tl-g" data-vision-id="win-maximizar" data-vision-icon="maximizar janela"></button>
      </div>
      <span class="title">Documentos</span>
      <div class="toolbar">
        <button class="tb" data-vision-id="finder-voltar" data-vision-icon="voltar"><svg width="7" height="12" viewBox="0 0 7 12" fill="none"><path d="M5.6 1 1 6l4.6 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="tb" data-vision-id="finder-avancar" data-vision-icon="avançar"><span style="transform:rotate(180deg);display:block"><svg width="7" height="12" viewBox="0 0 7 12" fill="none"><path d="M5.6 1 1 6l4.6 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
        <div class="search"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="5.6" cy="5.6" r="4.1" stroke="currentColor" stroke-width="1.3"/><path d="M8.9 8.9 11.4 11.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><input data-vision-id="finder-busca" placeholder="Buscar" data-vision-aliases="pesquisar arquivos"></div>
        <div class="seg">
          <button class="on" data-vision-id="finder-view-icones" data-vision-type="tab">Ícones</button>
          <button data-vision-id="finder-view-lista" data-vision-type="tab">Lista</button>
          <button data-vision-id="finder-view-colunas" data-vision-type="tab">Colunas</button>
        </div>
      </div>
    </div>
    <div class="body">
      <div class="side">
        <div class="head">Favoritos</div>
        <a href="#airdrop" class="on" data-vision-id="side-airdrop">AirDrop</a>
        <a href="#recentes" data-vision-id="side-recentes">Recentes</a>
        <a href="#aplicativos" data-vision-id="side-aplicativos">Aplicativos</a>
        <a href="#downloads" data-vision-id="side-downloads">Downloads</a>
        <a href="#documentos" data-vision-id="side-documentos">Documentos</a>
        <a href="#icloud" data-vision-id="side-icloud">iCloud Drive</a>
        <div class="head">Marcadores</div>
        <a href="#projetos" data-vision-id="side-projetos">Projetos</a>
      </div>
      <div class="content">
        <div class="colhead"><span>Nome</span><span>Data</span><span>Tamanho</span></div>
        <a href="#relatorio" data-vision-id="file-relatorio-q3" class="file" data-vision-label="Relatório Q3.pdf" data-vision-aliases="relatorio q3">
          <span class="nm"><span class="icon doc"></span><span>Relatório Q3.pdf</span></span><span style="color:#6e6e73">18 out 2026</span><span style="color:#6e6e73">2,4 MB</span>
        </a>
        <a href="#contratos" data-vision-id="file-contratos" class="file" data-vision-label="Contratos" data-vision-aliases="pasta contratos">
          <span class="nm"><span class="icon folder"></span><span>Contratos</span></span><span style="color:#6e6e73">12 out 2026</span><span style="color:#6e6e73">8 itens</span>
        </a>
        <a href="#fotos" data-vision-id="file-fotos" class="file" data-vision-label="Fotos da equipe" data-vision-aliases="pasta fotos">
          <span class="nm"><span class="icon folder"></span><span>Fotos da equipe</span></span><span style="color:#6e6e73">09 out 2026</span><span style="color:#6e6e73">24 itens</span>
        </a>
      </div>
    </div>
  </div>

  <div class="dock">
    <button class="app finder" data-vision-id="dock-finder" data-vision-icon="Finder" data-vision-aliases="finder"><svg width="26" height="26" viewBox="0 0 26 26" fill="#fff" aria-hidden="true"><path d="M13 2 4 6v14l9 4 9-4V6l-9-4Zm-4.4 7.2a.9.9 0 1 1 1.8 0v3.2a.9.9 0 1 1-1.8 0V9.2Zm7.2 0a.9.9 0 1 1 1.8 0v3.2a.9.9 0 1 1-1.8 0V9.2ZM8 17.1c1.2 1.4 3 2.2 5 2.2s3.8-.8 5-2.2l-1.3-1c-.9 1-2.2 1.6-3.7 1.6s-2.8-.6-3.7-1.6L8 17.1Z"/></svg></button>
    <button class="app safari" data-vision-id="dock-safari" data-vision-icon="Safari" data-vision-aliases="navegador safari"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true"><circle cx="13" cy="13" r="10" stroke="#fff" stroke-width="1.6"/><path d="m16.8 9.2-2.2 5.4-5.4 2.2 2.2-5.4 5.4-2.2Z" fill="#fff"/></svg></button>
    <button class="app mail" data-vision-id="dock-mail" data-vision-icon="Mail" data-vision-aliases="correio mail"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true"><rect x="3" y="6" width="20" height="14" rx="2.2" stroke="#fff" stroke-width="1.6"/><path d="m4 7 9 7 9-7" stroke="#fff" stroke-width="1.6"/></svg></button>
    <button class="app messages" data-vision-id="dock-mensagens" data-vision-icon="Mensagens" data-vision-aliases="messages"><svg width="26" height="26" viewBox="0 0 26 26" fill="#fff" aria-hidden="true"><path d="M13 4C7.5 4 3 7.6 3 12c0 2.4 1.3 4.5 3.5 5.9-.2 1.2-.8 2.4-1.7 3.3 1.9-.1 3.5-.7 4.7-1.5 1.1.3 2.3.4 3.5.4 5.5 0 10-3.6 10-8.1S18.5 4 13 4Z"/></svg></button>
    <button class="app trash" data-vision-id="dock-lixeira" data-vision-icon="Lixeira" data-vision-aliases="trash lixo"><svg width="24" height="26" viewBox="0 0 24 26" fill="none" aria-hidden="true"><path d="M5 8h14l-1 15H6L5 8Z" stroke="#fff" stroke-width="1.6"/><path d="M8 8V5h8v3M3 8h18" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  </div>
</div>
</body></html>
